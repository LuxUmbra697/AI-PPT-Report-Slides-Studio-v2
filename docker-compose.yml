services:
  postgres:
    image: postgres:16-alpine
    ports:
      - "39432:5432"
    environment:
      POSTGRES_USER: luxumbra
      POSTGRES_PASSWORD: luxumbra
      POSTGRES_DB: luxumbra
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U luxumbra -d luxumbra"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "39379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
