name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Backend checks
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: luxumbra
          POSTGRES_PASSWORD: luxumbra
          POSTGRES_DB: luxumbra
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U luxumbra -d luxumbra"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://luxumbra:luxumbra@127.0.0.1:5432/luxumbra
      REDIS_URL: redis://127.0.0.1:6379/0
      JWT_SECRET: ci-only-not-a-production-secret
      LLM_API_KEY: ci-placeholder
      IMAGE_API_KEY: ci-placeholder
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend dependencies
        working-directory: backend
        run: uv sync --frozen
      - name: Lint backend
        working-directory: backend
        run: uv run ruff check .
      - name: Apply database migrations
        working-directory: backend
        run: uv run alembic upgrade head
      - name: Test backend
        working-directory: backend
        run: uv run pytest

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Lint frontend
        working-directory: frontend
        run: npm run lint
      - name: Build frontend
        working-directory: frontend
        run: npm run build
