services:
  postgres:
    image: postgres:16-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: luxumbra
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-luxumbra}
      POSTGRES_DB: luxumbra
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U luxumbra -d luxumbra"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: ./backend
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://luxumbra:${POSTGRES_PASSWORD:-luxumbra}@postgres:5432/luxumbra
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ./shared:/shared:ro
      - ./Template:/Template:ro
      - media_data:/backend/var/storage
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  worker:
    build: ./backend
    command: ["uv", "run", "arq", "app.worker.settings.WorkerSettings"]
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://luxumbra:${POSTGRES_PASSWORD:-luxumbra}@postgres:5432/luxumbra
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ./shared:/shared:ro
      - ./Template:/Template:ro
      - media_data:/backend/var/storage
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  nginx:
    image: nginx:alpine
    ports:
      - "39880:80"
    volumes:
      - ./frontend/dist:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api

volumes:
  postgres_data:
  media_data:
